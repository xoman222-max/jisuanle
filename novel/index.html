<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小說｜免費線上閱讀｜算了 jisuanle</title>
<meta name="description" content="算了 jisuanle 小說：免費線上閱讀原創網路小說，無會員、無付費牆，支援夜間模式、字級調整與本機書架，持續連載中。">
<link rel="canonical" href="https://jisuanle.com/novel/">
<link rel="stylesheet" href="./css/reader.css">
</head>
<body>
<main class="wrap">
  <div class="topbar">
    <a href="/">← 算了</a>
    <span>免費線上閱讀 · 持續連載中</span>
  </div>
  <h1>小說</h1>
  <p class="meta">無會員、無付費牆。進度與書架存在本機瀏覽器。</p>
  <div class="search-row">
    <input id="novel-search" type="search" placeholder="搜尋書名或簡介…" autocomplete="off" enterkeyhint="search">
  </div>
  <h2 class="section-title">我的書架</h2>
  <p id="shelf-empty" class="shelf-empty">還沒有加入書架的書。到書的目錄頁按「加入書架」就會出現在這裡。</p>
  <div id="bookshelf" class="shelf-list"></div>
  <h2 class="section-title">最近閱讀</h2>
  <p id="recent-empty" class="shelf-empty">還沒有讀過的書。</p>
  <div id="recent" class="shelf-list"></div>
  <h2 class="section-title">全部作品</h2>
  <div id="book-list" class="book-list"></div>
</main>
<script src="./js/reader.js"></script>
<script>NovelReader.initHub();</script>
</body>
</html>
